<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artigos</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-alt: #f4f4f5;
    --fg: #1c1c1f;
    --fg-muted: #6b6b73;
    --border: #e2e2e5;
    --accent: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --bg-alt: #1e1e23;
      --fg: #e8e8ea;
      --fg-muted: #94949c;
      --border: #303038;
      --accent: #6c8bf5;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  header {
    position: sticky; top: 0; z-index: 1;
    display: flex; align-items: center; gap: 16px;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    background: var(--bg-alt);
  }
  header h1 { font-size: 1.2rem; margin: 0; white-space: nowrap; }
  #search {
    flex: 1; max-width: 420px; padding: 8px 12px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg); font-size: 0.9rem;
  }
  #count { font-size: 0.8rem; color: var(--fg-muted); white-space: nowrap; }

  main { max-width: 900px; margin: 0 auto; padding: 24px; }

  section.theme { margin-bottom: 28px; }
  section.theme h2 {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--fg-muted); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 4px;
  }
  section.theme h2 .count { font-weight: 400; }
  ul.entries { list-style: none; margin: 0; padding: 0; }
  ul.entries li { border-bottom: 1px solid var(--border); }
  ul.entries li.hidden { display: none; }
  ul.entries li a {
    display: block; padding: 10px 4px; color: var(--fg); text-decoration: none; line-height: 1.4;
  }
  ul.entries li a:hover { color: var(--accent); }
  section.theme.hidden { display: none; }
  section.theme h2 .links { font-weight: 400; text-transform: none; letter-spacing: 0; margin-left: 8px; }
  section.theme h2 .links a { color: var(--accent); text-decoration: none; }
  section.theme h2 .links a:hover { text-decoration: underline; }
  #status { color: var(--fg-muted); padding: 24px 4px; }
  #status.error { color: #c92a2a; }
</style>
</head>
<body>
  <header>
    <h1>Artigos</h1>
    <input id="search" type="search" placeholder="Buscar por título ou pasta...">
    <span id="count"></span>
  </header>
  <main>
    <p id="status">Carregando...</p>
    <div id="themes"></div>
  </main>
<script>
// A lista vem de manifest.json, gerado por scripts/build_manifest.py
// (e regenerado pela GitHub Action a cada push) — não editar a lista aqui.
(function () {
  const search = document.getElementById('search');
  const count = document.getElementById('count');
  const status = document.getElementById('status');
  const container = document.getElementById('themes');
  let themes = [];
  let total = 0;

  const encodePath = (p) => p.split('/').map(encodeURIComponent).join('/');

  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    node.append(...children);
    return node;
  }

  function render(manifest) {
    container.replaceChildren();
    manifest.themes.forEach((theme) => {
      const links = el('span', { className: 'links' });
      if (theme.concepts) {
        links.append(el('a', { href: encodePath(theme.concepts), textContent: 'conceitos' }));
      }
      const h2 = el('h2', {}, theme.name + ' ', el('span', { className: 'count', textContent: theme.papers.length }), links);
      const ul = el('ul', { className: 'entries' });
      theme.papers.forEach((paper) => {
        ul.append(el('li', {}, el('a', { href: encodePath(paper.summary), textContent: paper.title })));
      });
      container.append(el('section', { className: 'theme' }, h2, ul));
    });
    themes = Array.from(container.querySelectorAll('section.theme'));
    total = container.querySelectorAll('ul.entries li').length;
  }

  function applyFilter() {
    const q = search.value.trim().toLowerCase();
    let visible = 0;
    themes.forEach((section) => {
      const tema = section.querySelector('h2').firstChild.textContent.trim().toLowerCase();
      let anyVisible = false;
      section.querySelectorAll('ul.entries li').forEach((li) => {
        const text = (li.textContent + ' ' + tema).toLowerCase();
        const match = !q || text.includes(q);
        li.classList.toggle('hidden', !match);
        if (match) { anyVisible = true; visible++; }
      });
      section.classList.toggle('hidden', !anyVisible);
    });
    count.textContent = q ? `${visible} de ${total}` : `${total} resumos`;
  }

  search.addEventListener('input', applyFilter);

  fetch('manifest.json', { cache: 'no-cache' })
    .then((res) => {
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    })
    .then((manifest) => {
      status.remove();
      render(manifest);
      applyFilter();
    })
    .catch((err) => {
      status.className = 'error';
      status.textContent = `Não foi possível carregar manifest.json (${err.message}). ` +
        'Abrindo via file://? Use "python3 -m http.server" na raiz do projeto.';
    });
})();
</script>
</body>
</html>
