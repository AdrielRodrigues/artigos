<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artigos</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-alt: #f4f4f5;
    --fg: #1c1c1f;
    --fg-muted: #6b6b73;
    --border: #e2e2e5;
    --accent: #3b5bdb;
    --accent-soft: #e8edff;
    --sidebar-w: 280px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --bg-alt: #1e1e23;
      --fg: #e8e8ea;
      --fg-muted: #94949c;
      --border: #303038;
      --accent: #6c8bf5;
      --accent-soft: #262c4a;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 24px; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg);
  }

  .layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

  /* ---- barra lateral ---- */
  aside {
    position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
    padding: 28px 16px 28px 20px; border-right: 1px solid var(--border); background: var(--bg-alt);
  }
  aside .brand { margin: 0 8px 4px; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; }
  aside .total { margin: 0 8px 20px; font-size: 0.85rem; color: var(--fg-muted); }
  aside nav { display: flex; flex-direction: column; gap: 2px; }
  aside nav a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 10px 12px; border-radius: 8px; border-left: 3px solid transparent;
    color: var(--fg); text-decoration: none; font-size: 1.05rem; font-weight: 500; line-height: 1.3;
  }
  aside nav a .n { font-size: 0.8rem; font-weight: 400; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
  aside nav a:hover { background: var(--bg); }
  aside nav a.active { background: var(--accent-soft); border-left-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* ---- conteúdo ---- */
  main { max-width: 960px; width: 100%; padding: 40px 48px 96px; }
  section.theme { margin-bottom: 56px; }
  section.theme .head {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 16px;
    padding-bottom: 14px; margin-bottom: 6px; border-bottom: 2px solid var(--border);
  }
  section.theme h2 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.2; }
  section.theme .count { font-size: 0.95rem; color: var(--fg-muted); }
  section.theme .concepts {
    margin-left: auto; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--accent);
    color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 500; white-space: nowrap;
  }
  section.theme .concepts:hover { background: var(--accent); color: var(--bg); }

  ul.entries { list-style: none; margin: 0; padding: 0; }
  ul.entries li { border-bottom: 1px solid var(--border); }
  ul.entries li a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 20px;
    padding: 14px 6px; color: var(--fg); text-decoration: none; line-height: 1.45; font-size: 1rem;
  }
  ul.entries li a:hover { color: var(--accent); }
  ul.entries li .ano { flex: none; font-size: 0.85rem; color: var(--fg-muted); font-variant-numeric: tabular-nums; }

  #status { color: var(--fg-muted); padding: 24px 4px; }
  #status.error { color: #c92a2a; }

  /* ---- telas estreitas: a lateral vira uma faixa horizontal fixa no topo ---- */
  @media (max-width: 860px) {
    .layout { display: block; }
    aside {
      position: sticky; top: 0; z-index: 2; height: auto; overflow: visible;
      padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--border);
    }
    aside .brand { display: inline; font-size: 1.1rem; margin: 0 8px 0 4px; }
    aside .total { display: inline; margin: 0; }
    aside nav { flex-direction: row; overflow-x: auto; gap: 6px; margin-top: 8px; padding-bottom: 4px; }
    aside nav a { flex: none; border-left: 0; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 0.95rem; }
    aside nav a.active { border-color: var(--accent); }
    main { padding: 24px 16px 72px; }
    section.theme h2 { font-size: 1.6rem; }
    html { scroll-padding-top: 110px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1 class="brand">Artigos</h1>
    <p class="total" id="total"></p>
    <nav id="nav" aria-label="Temas"></nav>
  </aside>
  <main>
    <p id="status">Carregando...</p>
    <div id="themes"></div>
  </main>
</div>
<script>
// A lista vem de manifest.json, gerado por scripts/build_manifest.py
// (e regenerado pela GitHub Action a cada push) — não editar a lista aqui.
(function () {
  const status = document.getElementById('status');
  const container = document.getElementById('themes');
  const nav = document.getElementById('nav');
  const total = document.getElementById('total');

  const viewerUrl = (p) => 'viewer.html?f=' + encodeURIComponent(p);  // .md abre renderizado no leitor
  const slugify = (s) => 'tema-' + s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
  // Nome de exibição: "projeto_universal" -> "Projeto universal"; siglas curtas ficam em maiúsculas
  // ("pon" -> "PON", "fl_ran" -> "FL RAN"). Exceções em NOMES.
  const NOMES = { '5g6g': '5G / 6G' };
  const label = (name) => {
    if (NOMES[name]) return NOMES[name];
    const words = name.split('_').map((w, i) => {
      if (w.length <= 3 || /\d/.test(w)) return w.toUpperCase();
      return i === 0 ? w.charAt(0).toUpperCase() + w.slice(1) : w;
    });
    return words.join(' ');
  };

  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    node.append(...children);
    return node;
  }

  function render(manifest) {
    let count = 0;
    manifest.themes.forEach((theme) => {
      const id = slugify(theme.name);
      count += theme.papers.length;

      const link = el('a', { href: '#' + id },
        el('span', { textContent: label(theme.name) }),
        el('span', { className: 'n', textContent: theme.papers.length }));
      link.dataset.target = id;
      nav.append(link);

      const head = el('div', { className: 'head' },
        el('h2', { textContent: label(theme.name) }),
        el('span', { className: 'count', textContent: `${theme.papers.length} resumos` }));
      if (theme.concepts) {
        head.append(el('a', { className: 'concepts', href: viewerUrl(theme.concepts), textContent: 'Conceitos' }));
      }

      const ul = el('ul', { className: 'entries' });
      theme.papers.forEach((paper) => {
        const a = el('a', { href: viewerUrl(paper.summary) }, el('span', { textContent: paper.title }));
        if (paper.ano) a.append(el('span', { className: 'ano', textContent: paper.ano }));
        ul.append(el('li', {}, a));
      });

      container.append(el('section', { className: 'theme', id }, head, ul));
    });
    total.textContent = `${count} resumos em ${manifest.themes.length} temas`;
  }

  // Mantém o link ativo visível rolando SÓ o contêiner da navegação (nunca a página).
  // Não usar scrollIntoView aqui: no celular ele brigava com o gesto de rolar e travava a página.
  function keepVisible(link) {
    const horizontal = getComputedStyle(nav).flexDirection === 'row';  // celular: faixa horizontal
    const box = horizontal ? nav : document.querySelector('aside');     // desktop: a própria lateral rola
    const b = box.getBoundingClientRect();
    const r = link.getBoundingClientRect();
    if (horizontal) {
      box.scrollLeft += (r.left + r.width / 2) - (b.left + b.width / 2);
    } else if (r.top < b.top + 8) {
      box.scrollTop += r.top - b.top - 8;
    } else if (r.bottom > b.bottom - 8) {
      box.scrollTop += r.bottom - b.bottom + 8;
    }
  }

  // Destaca na lateral o tema que está em vista.
  function spy() {
    const links = new Map(Array.from(nav.querySelectorAll('a')).map((a) => [a.dataset.target, a]));
    const sections = Array.from(container.querySelectorAll('section.theme'));
    let lastId = null;
    function update() {
      const line = window.innerHeight * 0.3;
      let current = sections[0];
      for (const s of sections) {
        if (s.getBoundingClientRect().top <= line) current = s;
      }
      // no fim da página o último tema sempre fica ativo
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
        current = sections[sections.length - 1];
      }
      if (!current || current.id === lastId) return;   // só mexe quando o tema ativo muda
      lastId = current.id;
      links.forEach((a, id) => a.classList.toggle('active', id === current.id));
      keepVisible(links.get(current.id));
    }
    addEventListener('scroll', update, { passive: true });
    addEventListener('resize', update);
    update();
  }

  fetch('manifest.json', { cache: 'no-cache' })
    .then((res) => {
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    })
    .then((manifest) => {
      status.remove();
      render(manifest);
      spy();
      if (location.hash) {
        const target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (target) target.scrollIntoView({ behavior: 'instant' });
      }
    })
    .catch((err) => {
      status.className = 'error';
      status.textContent = `Não foi possível carregar manifest.json (${err.message}). ` +
        'Abrindo via file://? Use "python3 -m http.server" na raiz do projeto.';
    });
})();
</script>
</body>
</html>
