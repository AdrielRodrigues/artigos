<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDFs</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1c1c1f;
    --fg-muted: #6b6b73;
    --border: #e2e2e5;
    --accent: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --fg: #e8e8ea;
      --fg-muted: #94949c;
      --border: #303038;
      --accent: #6c8bf5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 96px; }
  .back { color: var(--fg-muted); text-decoration: none; font-size: 0.9rem; }
  .back:hover { color: var(--accent); }
  h1 { margin: 12px 0 4px; font-size: 2rem; font-weight: 700; letter-spacing: -0.015em; }
  #status { margin: 0 0 20px; color: var(--fg-muted); font-size: 0.95rem; }

  ul { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--border); }
  li { border-bottom: 1px solid var(--border); }
  li a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 20px;
    padding: 14px 6px; color: var(--fg); text-decoration: none; line-height: 1.45;
  }
  li a:hover { color: var(--accent); }
  li .name { overflow-wrap: anywhere; }
  li .size { flex-shrink: 0; font-size: 0.85rem; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <a class="back" href="../">← Artigos</a>
  <h1>PDFs</h1>
  <p id="status">Carregando…</p>
  <ul id="list"></ul>
</main>
<script>
  // Lista os PDFs desta pasta via API do GitHub (o Pages não gera índice de diretório).
  const API = "https://api.github.com/repos/AdrielRodrigues/artigos/contents/pdf?ref=main";

  const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  const prettyName = f => f.replace(/\.pdf$/i, "").replace(/_/g, " ");

  fetch(API)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(items => {
      const pdfs = items
        .filter(i => i.type === "file" && /\.pdf$/i.test(i.name))
        .sort((a, b) => a.name.localeCompare(b.name, "pt-br"));
      const status = document.getElementById("status");
      status.textContent = pdfs.length === 1 ? "1 arquivo" : pdfs.length + " arquivos";

      const list = document.getElementById("list");
      for (const f of pdfs) {
        const a = document.createElement("a");
        a.href = encodeURIComponent(f.name);
        a.target = "_blank";
        a.rel = "noopener";
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = prettyName(f.name);
        const size = document.createElement("span");
        size.className = "size";
        size.textContent = fmtSize(f.size);
        a.append(name, size);
        const li = document.createElement("li");
        li.append(a);
        list.append(li);
      }
    })
    .catch(err => {
      document.getElementById("status").textContent =
        "Não foi possível carregar a lista (" + err.message + "). Tente novamente mais tarde.";
    });
</script>
</body>
</html>
